<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Helper - Brew & Bean</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <nav class="top-nav">
            <button class="back-btn" onclick="navigateTo('index.html')">← Back</button>
            <h1 class="page-title">POS Helper</h1>
            <div class="nav-spacer"></div>
        </nav>

        <div class="pos-layout">
            <div class="pos-menu-section">
                <div class="search-bar">
                    <input type="text" id="posSearch" placeholder="🔍 Search menu items..." oninput="filterPOSMenu()">
                </div>
                <div class="pos-category-tabs" id="posCategoryTabs"></div>
                <div class="pos-items-grid" id="posItemsGrid"></div>
            </div>

            <div class="pos-checkout-section">
                <div class="receipt-header">
                    <h2>Current Bill</h2>
                    <div class="receipt-info">
                        <span>Receipt #<span id="receiptNumber"></span></span>
                        <span id="receiptTime"></span>
                    </div>
                </div>

                <div class="receipt-items" id="receiptItems">
                    <div class="empty-receipt">
                        <div class="empty-icon">🧾</div>
                        <p>Add items to start checkout</p>
                    </div>
                </div>

                <div class="receipt-total-section">
                    <div class="receipt-line">
                        <span>Subtotal:</span>
                        <span id="posSubtotal">₱0.00</span>
                    </div>
                    <div class="receipt-line discount-line">
                        <span>Discount:</span>
                        <input type="number" id="discountAmount" min="0" step="0.01" value="0" oninput="calculatePOSTotal()">
                    </div>
                    <div class="receipt-line grand-total-line">
                        <span>TOTAL:</span>
                        <span id="posGrandTotal">₱0.00</span>
                    </div>
                </div>

                <div class="payment-note">
                    <p>💡 Payment is manual (Cash/Card)</p>
                </div>

                <div class="pos-actions">
                    <button class="btn btn-secondary" onclick="clearPOS()">Clear</button>
                    <button class="btn btn-success" onclick="printReceipt()">Print Receipt</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="receiptModal">
        <div class="modal-content receipt-modal">
            <div class="receipt-print" id="receiptPrint">
                <div class="receipt-logo">☕ Brew & Bean</div>
                <div class="receipt-shop-info">
                    Premium Coffee Shop<br>
                    Thank you for your visit!
                </div>
                <div class="receipt-divider"></div>
                <div class="receipt-number">Receipt #<span id="printReceiptNumber"></span></div>
                <div class="receipt-date" id="printReceiptDate"></div>
                <div class="receipt-divider"></div>
                <div class="receipt-items-list" id="printReceiptItems"></div>
                <div class="receipt-divider"></div>
                <div class="receipt-totals" id="printReceiptTotals"></div>
                <div class="receipt-divider"></div>
                <div class="receipt-footer">
                    Please come again!<br>
                    Have a great day! ☕
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeReceiptModal()">Close</button>
                <button class="btn btn-primary" onclick="window.print()">Print</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="pos-system.js"></script>
</body>
</html>
